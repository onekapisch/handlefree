name: Report a beta problem
description: Share a reproducible Handlefree issue without personal or vehicle identifiers.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include a VIN, keys, credentials, precise location or unredacted logs. Security concerns go to support@onekapisch.com. Test only while parked with the area clear."
  - type: textarea
    id: environment
    attributes:
      label: App and device versions
      description: App build, phone/Watch model, OS version and vehicle model/year/software. Omit your VIN.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: What happened?
      description: Describe the action, how it was triggered, what you expected and what actually happened.
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: On-screen message
      description: Paste only the relevant message, with any personal details removed.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have excluded VINs, keys, credentials, locations and unredacted logs.
          required: true
